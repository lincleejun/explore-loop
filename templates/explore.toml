# The machine-readable part of the campaign. Every check explore enforces is read from here; a constraint that is not here is only words, and nothing stops it.
# Paths are relative to this file, or absolute. Build and test output must be in the target repository's .gitignore: explore does not measure a dirty worktree.

repo = "<REPO>"                 # the main checkout the owner works in
branch = "<BRANCH>"             # the campaign branch: landed patches fast-forward to it
base_worktree = "<BASE>"        # the worktree that has the campaign branch checked out = the current baseline
strict = false                  # true = landing also needs a review of this very code (experiments/E###.review.md)
locked = []                     # paths that must not change during the campaign (model weights, eval sets). explore doctor --snapshot records fingerprints
harness = []                    # the measuring harness's files (globs). Candidates may not change them; when they change, calibrate again. E.g. ["bench/*", "measure.sh"]

[agents]                        # who investigates and who reviews proposals. A name is an agent you can dispatch: a subagent type, a model, an external tool (codex goes through codex.sh). The tool only checks the names written in the records
investigate = ["claude", "codex"]   # which kinds of agent investigate: read-only, in parallel. Each kind hands in at least one rounds/<base>/<name>-<topic>.md per round
review = ["codex", "claude"]        # proposal reviewers: they review the contract, and may not be the investigator who proposed it

[loop]                          # the owner decides. Ask before starting; use the defaults if they do not say
rounds = "<ROUNDS>"             # depth: how many rounds (a round = profile, investigate and experiment on one baseline). Default 10; close out when done
width = "<WIDTH>"               # width: how many investigators per round, each on a different topic. Default 3, usually 3–5, more for a big codebase

[commands]                      # all run inside the worktree being measured
build = "<BUILD>"               # built once on each side before measuring. Leave empty if there is no build
measure = "<MEASURE>"           # one pass that prints metric lines: PERF name number s|ms, or METRIC lower|higher|exact name value unit
test = "<TEST>"                 # exit code 0 = pass. Make "a test was skipped" a failure too
env = ""                        # prints the environment fingerprint (build config, device, dependency versions). When it changes, old calibrations and measurements no longer count
busy = ""                       # any output = other load on the machine, do not measure. E.g. pgrep -fl 'xcodebuild|pytest'

[rules]
pairs = 10                      # how many baseline/candidate pairs to measure. explore power tells you whether that is enough
alpha = 0.05                    # upper bound on the total probability that pure noise causes a wrong verdict in one landing
guard = 5                       # a metric that is not a target counts as regressed only when it is more than 5% worse
floor = 0                       # an additional absolute tolerance (in the metric's own unit). 0.001 is a good value for durations
max_load = 0                    # the measurement is void when the 1-minute load is above this. 0 = not checked

# Invariants: run for every candidate before it lands; exit code 0 = it holds. EXPLORE_BASE = the baseline worktree
# [[invariants]]
# name = "output is bit-identical with the switch at its default off"
# cmd = "scripts/same_output.sh $EXPLORE_BASE ."

# Datasets (only for tuning and accuracy work). role: train / select (tuning and model selection) / accept (acceptance) / final (holdout)
# final must live outside the repository and is reached only through explore holdout
# [[datasets]]
# name = "G"
# path = "/data/eval/g.csv"
# role = "final"
# strata = "global; never used for tuning"
# leak = "shares a source with the prior data: each sample's own record is removed before evaluation"
