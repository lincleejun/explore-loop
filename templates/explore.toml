# 战役的机器可读部分。explore 的每条强制检查都从这里读；这里没写的约束只是文字，没人拦。
# 路径相对这个文件，也可以写绝对路径。构建和测试留下的文件要在目标仓库的 .gitignore 里：worktree 不干净，explore 不量。

repo = "<REPO>"                 # 所有者在用的主检出
branch = "<BRANCH>"             # 战役分支：落地的补丁快进到这里
base_worktree = "<BASE>"        # 检出战役分支的 worktree = 当前基线
strict = false                  # true = 落地前要一份针对这份代码的评审（experiments/E###.review.md）
locked = []                     # 战役期间不许变的路径（模型权重、评测集）。explore doctor --snapshot 记指纹

[commands]                      # 都在被测的 worktree 里执行
build = "<BUILD>"               # 测量前两边各构建一次。不用构建就留空
measure = "<MEASURE>"           # 跑一遍，打印指标行：PERF 名称 数字 s|ms，或 METRIC lower|higher|exact 名称 值 单位
test = "<TEST>"                 # 退出码 0 = 过。把"有测试被跳过"也算失败
env = ""                        # 打印环境指纹（编译配置、设备、依赖版本）。变了，旧的校准和测量都不算数
busy = ""                       # 有输出 = 机器上有别的负载，不量。例：pgrep -fl 'xcodebuild|pytest'

[rules]
pairs = 10                      # 基线和候选成对量几对。explore power 告诉你够不够
alpha = 0.05                    # 一次落地里，纯噪声造成误判的总概率上限
guard = 5                       # 目标之外的指标，变差超过 5% 才算回归
floor = 0                       # 再加一条绝对值容忍度（指标自己的单位）。耗时类建议 0.001
max_load = 0                    # 1 分钟负载超过它，这次测量作废。0 = 不查

# 不变量：每个候选落地前必跑，退出码 0 = 守住了。EXPLORE_BASE = 基线 worktree
# [[invariants]]
# name = "开关默认关时输出逐位相同"
# cmd = "scripts/same_output.sh $EXPLORE_BASE ."

# 数据集（调参、准确率类项目才需要）。role：train / select（调参选型）/ accept（验收）/ final（留出终验）
# final 要放在仓库之外，只经 explore holdout 访问
